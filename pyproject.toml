[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skills-auditor"
dynamic = ["version"]
description = "Plan, apply, and verify local AI skill integrations across agent hosts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["cursor", "claude", "skills", "agents", "symlink"]
authors = [{ name = "skills-auditor contributors" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/ERerGB/skills-auditor"
Documentation = "https://github.com/ERerGB/skills-auditor#readme"
Issues = "https://github.com/ERerGB/skills-auditor/issues"
Source = "https://github.com/ERerGB/skills-auditor"

[project.scripts]
skills-audit = "skills_auditor.cli:main"

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6,<8",
  "jsonschema>=4.23,<5",
]

[tool.hatch.version]
path = "skills_auditor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["skills_auditor"]

[tool.hatch.build.targets.sdist]
include = [
  "/skills_auditor",
  "/config",
  "/docs",
  "/e2e_tests",
  "/scripts",
  "/smoke_tests",
  "/tests",
  "/skills_auditor/schemas",
  "/LICENSE",
  "/README.md",
  "/SKILL.md",
]

[tool.coverage.run]
branch = true
source = ["skills_auditor"]

[tool.coverage.report]
fail_under = 90
precision = 1
show_missing = true
skip_covered = true
